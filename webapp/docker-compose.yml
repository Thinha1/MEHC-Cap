# Run the frontend and the backend in one container:
#   docker compose up --build
# Open http://localhost:3000 (UI), http://localhost:8000/docs (API).
# Models live in ./backend/weights (see backend/README.md) and are mounted read-only.

services:
  webapp:
    image: klcn-webapp
    build:
      context: .
      args:
        # Change to http://<host-ip>:8000 to open the UI from another machine
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        TORCH_CUDA_TAG: cu121
    ports:
      - "3000:3000"
      - "8000:8000"
    volumes:
      - ./backend/weights:/app/webapp/backend/weights:ro
      - webapp-uploads:/app/webapp/backend/uploads
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  webapp-uploads:
